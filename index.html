<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeerStone Quest • Professional Arcade</title>
    <style>
        body { margin:0; padding:0; background:#0b1f0b; overflow:hidden; font-family:Arial; color:#fff; }
        canvas { display:block; margin:0 auto; image-rendering:pixelated; box-shadow: 0 0 40px #f4d9a3; }
        #ui { position:absolute; top:12px; left:12px; font-size:22px; background:rgba(11,31,11,0.85); padding:8px 18px; border-radius:12px; z-index:100; box-shadow:0 0 15px #f4d9a3; }
    </style>
</head>
<body>
    <div id="ui">Faith: <span id="faith">45</span> | Level 1: Sacred Grove</div>
    <canvas id="game" width="1024" height="576"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let faith = 45;
        let cameraX = 0;
        let player = { x: 120, y: 320, vx: 0, vy: 0, width: 38, height: 54, onGround: false, frame: 0, facing: 1 };
        let keys = {};

        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        const platforms = [
            {x:0, y:480, w:2500, h:96}, // long ground
            {x:280, y:380, w:260, h:20},
            {x:620, y:290, w:200, h:20},
            {x:920, y:360, w:180, h:20},
            {x:1250, y:240, w:220, h:20},
            {x:1600, y:320, w:160, h:20}
        ];

        function update() {
            player.vx *= 0.85;
            if (keys['arrowleft'] || keys['a']) { player.vx -= 1.5; player.facing = -1; }
            if (keys['arrowright'] || keys['d']) { player.vx += 1.5; player.facing = 1; }
            if ((keys[' '] || keys['arrowup'] || keys['w']) && player.onGround) {
                player.vy = -18.5;
                player.onGround = false;
            }

            player.x += player.vx;
            player.y += player.vy;
            player.vy += 0.92; // gravity

            // Platform collisions
            player.onGround = false;
            for (let p of platforms) {
                if (player.x + player.width > p.x && player.x < p.x + p.w &&
                    player.y + player.height > p.y && player.y + player.height - player.vy <= p.y && player.vy >= 0) {
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.onGround = true;
                }
            }

            // Prayer power-up
            if (keys['z']) faith = Math.min(100, faith + 1.8);

            // Camera follows player (Mario style)
            cameraX = Math.max(0, player.x - 420);

            document.getElementById('faith').textContent = Math.floor(faith);
            player.frame += 0.22;
        }

        function draw() {
            // Sky
            ctx.fillStyle = '#0f2a4a';
            ctx.fillRect(0, 0, 1024, 576);

            // Parallax distant trees/hills
            ctx.fillStyle = '#1a3d2a';
            ctx.fillRect(0 - cameraX*0.3, 320, 3000, 160);

            // Ground
            ctx.fillStyle = '#5c4033';
            ctx.fillRect(0 - cameraX, 480, 2500, 96);

            // Platforms
            ctx.fillStyle = '#a07040';
            for (let p of platforms) {
                ctx.fillRect(p.x - cameraX, p.y, p.w, p.h);
            }

            // Vines
            ctx.strokeStyle = '#0a5';
            ctx.lineWidth = 24;
            ctx.beginPath(); ctx.moveTo(340 - cameraX, 80); ctx.quadraticCurveTo(355 - cameraX, 240, 315 - cameraX, 520); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(1050 - cameraX, 60); ctx.quadraticCurveTo(1070 - cameraX, 220, 1030 - cameraX, 520); ctx.stroke();

            // Joseph Smith
            const px = player.x - cameraX;
            const py = player.y;
            ctx.save();
            ctx.translate(px + 19, py + 27);
            ctx.scale(player.facing, 1);

            // Coat
            ctx.fillStyle = '#3d2b1f';
            ctx.fillRect(-15, -6, 30, 42);
            // Skin/head
            ctx.fillStyle = '#f4d9a3';
            ctx.fillRect(-12, -26, 24, 24);
            // Hat
            ctx.fillStyle = '#2a2a2a';
            ctx.fillRect(-19, -34, 38, 13);
            // Boots
            ctx.fillStyle = '#2a2a2a';
            ctx.fillRect(-15, 32, 12, 9);
            ctx.fillRect(4, 32, 12, 9);

            ctx.restore();

            // Faith Orbs
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#ffeeaa';
            ctx.fillStyle = '#ffeeaa';
            ctx.beginPath(); ctx.arc(480 - cameraX, 260, 19, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(1150 - cameraX, 200, 19, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;

            // Pillar of Light (goal)
            ctx.shadowBlur = 60;
            ctx.shadowColor = '#ffeecc';
            ctx.fillStyle = '#ffeecc';
            ctx.fillRect(1750 - cameraX, 110, 48, 380);
            ctx.shadowBlur = 0;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        setInterval(() => {
            if (player.x > 1720 && faith > 78) {
                alert("🎉 Level 1 Complete!\n\nYou reached the Pillar of Light in the Sacred Grove.\n\nJoseph witnessed the First Vision.\n\nFaith greatly strengthened.\n\nLevel 2 - Hill Cumorah coming soon!");
                player.x = 120;
                faith = 45;
                cameraX = 0;
            }
        }, 250);

        loop();
    </script>
</body>
</html>
