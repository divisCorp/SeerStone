<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeerStone Quest - Arcade</title>
    <style>
        body { margin:0; background:#0b1f0b; overflow:hidden; font-family:Arial; color:white; text-align:center; }
        canvas { display:block; margin:20px auto; image-rendering:pixelated; border:4px solid #f4d9a3; }
        #ui { position:absolute; top:15px; left:15px; font-size:22px; text-shadow:2px 2px 4px #000; }
        #instructions { position:absolute; bottom:10px; left:0; right:0; font-size:14px; }
    </style>
</head>
<body>
    <div id="ui">Faith: <span id="faith">40</span>  Level 1: Sacred Grove</div>
    <canvas id="game" width="800" height="450"></canvas>
    <div id="instructions">
        ← → Move  SPACE Jump  X Attack  Z Pray (Power-up)  Mobile: Tap virtual buttons
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let faith = 40;
        let player = { x: 80, y: 250, w: 32, h: 48, vx: 0, vy: 0, onGround: false };
        let keys = {};
        let score = 0;

        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        function update() {
            // Movement
            player.vx = 0;
            if (keys['arrowleft'] || keys['a']) player.vx = -6;
            if (keys['arrowright'] || keys['d']) player.vx = 6;
            if ((keys[' '] || keys['arrowup'] || keys['w']) && player.onGround) {
                player.vy = -18;
                player.onGround = false;
            }

            player.x += player.vx;
            player.y += player.vy;
            player.vy += 0.9; // gravity

            // Ground & platforms
            if (player.y > 350) { player.y = 350; player.vy = 0; player.onGround = true; }
            if (player.x > 280 && player.x < 520 && player.y > 220 && player.y < 250 && player.vy > 0) {
                player.y = 220; player.vy = 0; player.onGround = true;
            }

            // Prayer power-up
            if (keys['z']) faith = Math.min(100, faith + 0.8);

            // Boundaries
            player.x = Math.max(0, Math.min(750, player.x));

            document.getElementById('faith').textContent = Math.floor(faith);
        }

        function draw() {
            // Background
            ctx.fillStyle = '#0b3d0b';
            ctx.fillRect(0, 0, 800, 450);

            // Ground
            ctx.fillStyle = '#5c4033';
            ctx.fillRect(0, 380, 800, 70);

            // Platform
            ctx.fillStyle = '#8b5a2b';
            ctx.fillRect(280, 250, 240, 20);

            // Vines
            ctx.fillStyle = '#0a4';
            ctx.fillRect(140, 120, 18, 270);
            ctx.fillRect(620, 90, 18, 300);

            // Joseph (hero)
            ctx.fillStyle = '#ffcc88'; // robe
            ctx.fillRect(player.x, player.y, player.w, player.h);
            ctx.fillStyle = '#ffddaa'; // head
            ctx.fillRect(player.x + 8, player.y - 12, 16, 16);

            // Faith orbs
            ctx.fillStyle = '#ffff00';
            ctx.beginPath(); ctx.arc(380, 180, 14, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#ffaa00';
            ctx.beginPath(); ctx.arc(650, 160, 14, 0, Math.PI*2); ctx.fill();

            // Pillar of Light (goal)
            ctx.fillStyle = '#ffeeaa';
            ctx.fillRect(700, 100, 30, 280);

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 24px Arial';
            ctx.fillText('Reach the Pillar!', 520, 80);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Win condition
        setInterval(() => {
            if (player.x > 680 && faith > 65) {
                alert("🎉 Level Complete! You experienced the First Vision!\n\nFaith strengthened. Hill Cumorah coming next!");
                player.x = 80;
                faith = Math.min(100, faith + 20);
            }
        }, 300);

        loop();
    </script>
</body>
</html>
