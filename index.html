<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeerStone Quest • Professional Arcade</title>
    <style>
        body { margin:0; padding:0; background:#0b1f0b; overflow:hidden; font-family:Arial; color:#fff; }
        canvas { display:block; margin:0 auto; image-rendering:pixelated; border:6px solid #f4d9a3; box-shadow:0 0 40px #f4d9a3; }
        #ui { position:absolute; top:15px; left:15px; font-size:24px; background:rgba(0,0,0,0.75); padding:12px 24px; border-radius:12px; z-index:10; display:flex; align-items:center; gap:20px; }
        #message { position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); background:rgba(10,20,40,0.95); padding:40px 60px; border-radius:30px; text-align:center; font-size:32px; line-height:1.4; display:none; z-index:100; box-shadow:0 0 60px #ffeecc; }
    </style>
</head>
<body>
    <div id="ui">Faith: <span id="faith">45</span> | Level 1: Sacred Grove</div>
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="message"></div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let faith = 45;
        let cameraX = 0;
        let player = { x: 150, y: 400, vx: 0, vy: 0, width: 42, height: 58, onGround: false, frame: 0, facing: 1 };
        let keys = {};
        let enemies = [{x: 800, y: 340, vx: -2, width: 50, height: 50, alive: true}, {x: 1250, y: 280, vx: 1.8, width: 50, height: 50, alive: true}];
        let particles = [];

        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        const platforms = [
            {x:0, y:620, w:3000, h:100},
            {x:320, y:480, w:280, h:20},
            {x:720, y:380, w:220, h:20},
            {x:1050, y:460, w:260, h:20},
            {x:1450, y:320, w:200, h:20},
            {x:1800, y:520, w:180, h:20}
        ];

        function createParticle(x, y, color = '#ffeeaa') {
            particles.push({x, y, vx: Math.random()*10 - 5, vy: Math.random()*-8 - 3, life: 50, color});
        }

        function update() {
            player.vx *= 0.84;
            if (keys['arrowleft'] || keys['a']) { player.vx -= 1.8; player.facing = -1; }
            if (keys['arrowright'] || keys['d']) { player.vx += 1.8; player.facing = 1; }
            if ((keys[' '] || keys['arrowup'] || keys['w']) && player.onGround) { player.vy = -20; player.onGround = false; }

            player.x += player.vx;
            player.y += player.vy;
            player.vy += 0.95;

            player.onGround = false;
            for (let p of platforms) {
                if (player.x + player.width > p.x && player.x < p.x + p.w &&
                    player.y + player.height > p.y && player.y + player.height - player.vy <= p.y && player.vy >= 0) {
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.onGround = true;
                }
            }

            const praying = keys['z'];
            if (praying) {
                faith = Math.min(100, faith + 2);
                if (Math.random() > 0.4) createParticle(player.x + 21, player.y + 25);
            }

            for (let e of enemies) {
                if (e.alive) {
                    e.x += e.vx;
                    if (e.x < 600 || e.x > 1700) e.vx *= -1;
                    if (praying && Math.abs(e.x - player.x) < 140 && Math.abs(e.y - player.y) < 140) {
                        e.alive = false;
                        for (let i = 0; i < 30; i++) createParticle(e.x + 25, e.y + 25, '#aaccff');
                    }
                }
            }

            cameraX = Math.max(0, player.x - 500);

            document.getElementById('faith').textContent = Math.floor(faith);
            player.frame += 0.3;
        }

        function draw() {
            ctx.fillStyle = '#0b2a4a';
            ctx.fillRect(0, 0, 1280, 720);

            // Parallax
            ctx.fillStyle = '#1e4a2a';
            ctx.fillRect(0 - cameraX * 0.2, 340, 4000, 200);

            ctx.fillStyle = '#5c4033';
            ctx.fillRect(0 - cameraX, 620, 3000, 100);

            ctx.fillStyle = '#a07040';
            for (let p of platforms) {
                ctx.fillRect(p.x - cameraX, p.y, p.w, p.h);
            }

            // Vines
            ctx.strokeStyle = '#0a5';
            ctx.lineWidth = 28;
            ctx.beginPath(); ctx.moveTo(380 - cameraX, 80); ctx.quadraticCurveTo(400 - cameraX, 300, 360 - cameraX, 650); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(1200 - cameraX, 60); ctx.quadraticCurveTo(1220 - cameraX, 280, 1180 - cameraX, 650); ctx.stroke();

            // Joseph Smith
            const px = player.x - cameraX;
            const py = player.y;
            ctx.save();
            ctx.translate(px + 21, py + 29);
            ctx.scale(player.facing, 1);
            ctx.fillStyle = '#2c3a5e';
            ctx.fillRect(-17, -8, 34, 42);
            ctx.fillStyle = '#f4d9a3';
            ctx.fillRect(-14, -30, 28, 26);
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(-21, -40, 42, 16);
            ctx.fillStyle = '#3d2b1f';
            ctx.fillRect(-17, 32, 14, 10);
            ctx.fillRect(4, 32, 14, 10);
            ctx.restore();

            // Black Doubt Clouds
            for (let e of enemies) {
                if (e.alive) {
                    ctx.fillStyle = '#222244';
                    ctx.shadowBlur = 35;
                    ctx.shadowColor = '#555577';
                    ctx.beginPath();
                    ctx.ellipse(e.x - cameraX + 25, e.y + 25, 32, 25, 0, 0, Math.PI*2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            // Faith Orbs
            ctx.shadowBlur = 40;
            ctx.shadowColor = '#ffeeaa';
            ctx.fillStyle = '#ffeeaa';
            ctx.beginPath(); ctx.arc(580 - cameraX, 320, 22, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(1380 - cameraX, 260, 22, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;

            // Pillar of Light
            ctx.shadowBlur = 80;
            ctx.shadowColor = '#ffeecc';
            ctx.fillStyle = '#ffeecc';
            ctx.fillRect(2150 - cameraX, 80, 55, 550);
            ctx.shadowBlur = 0;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // First Vision climax
        setInterval(() => {
            if (player.x > 2100 && faith > 80) {
                const msg = document.getElementById('message');
                msg.style.display = 'block';
                msg.innerHTML = `<h1 style="color:#ffeecc;margin:0 0 20px 0;font-size:42px">The First Vision</h1>
                <p style="font-size:26px;line-height:1.5">A pillar of light descends from heaven...<br><br>
                <strong>The Father speaks:</strong><br>"This is My Beloved Son. Hear Him!"</p>
                <div style="margin-top:30px;font-size:20px;color:#ffeecc">Joseph's faith is strengthened forever.</div>
                <button onclick="this.parentElement.style.display='none';player.x=150;faith=45;" style="margin-top:30px;padding:16px 40px;font-size:22px;background:#f4d9a3;color:#0b2a4a;border:none;border-radius:12px;cursor:pointer">Continue the Restoration Journey</button>`;
            }
        }, 300);

        loop();
    </script>
</body>
</html>
