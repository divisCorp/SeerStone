<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeerStone Quest • Professional Arcade</title>
    <style>
        body { margin:0; background:#0b1f0b; overflow:hidden; font-family:Arial; color:#fff; }
        canvas { display:block; margin:0 auto; image-rendering:pixelated; border:4px solid #f4d9a3; }
        #ui { position:absolute; top:15px; left:15px; font-size:20px; background:rgba(0,0,0,0.5); padding:8px 15px; border-radius:8px; z-index:10; }
        #instructions { position:absolute; bottom:10px; left:0; right:0; text-align:center; font-size:14px; color:#ddd; }
    </style>
</head>
<body>
    <div id="ui">Faith: <span id="faith">40</span> | Level 1: Sacred Grove</div>
    <canvas id="game" width="800" height="480"></canvas>
    <div id="instructions">←→ Move | SPACE Jump | X Attack | Z Pray (Power-up) | Reach the Pillar of Light</div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let faith = 40;
        let player = {x:80, y:300, w:32, h:48, vx:0, vy:0, onGround:false};
        let keys = {};
        let score = 0;

        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        function update() {
            player.vx = 0;
            if (keys['arrowleft'] || keys['a']) player.vx = -6;
            if (keys['arrowright'] || keys['d']) player.vx = 6;
            if ((keys[' '] || keys['arrowup'] || keys['w']) && player.onGround) {
                player.vy = -17;
                player.onGround = false;
            }

            player.x += player.vx;
            player.y += player.vy;
            player.vy += 0.85;

            if (player.y > 380) { player.y = 380; player.vy = 0; player.onGround = true; }
            if (player.x > 280 && player.x < 520 && player.y > 220 && player.y < 250 && player.vy > 0) {
                player.y = 220; player.vy = 0; player.onGround = true;
            }

            if (keys['z']) faith = Math.min(100, faith + 1);

            player.x = Math.max(20, Math.min(760, player.x));
            document.getElementById('faith').textContent = Math.floor(faith);
        }

        function draw() {
            ctx.fillStyle = '#0a3d1f';
            ctx.fillRect(0,0,800,480);

            ctx.fillStyle = '#5c4033';
            ctx.fillRect(0,410,800,70);

            ctx.fillStyle = '#8b5a2b';
            ctx.fillRect(280,260,240,20);
            ctx.fillRect(520,180,180,20);

            ctx.fillStyle = '#0a5';
            ctx.fillRect(150,120,22,320);
            ctx.fillRect(620,80,22,350);

            // Joseph Smith sprite
            ctx.fillStyle = '#3d2b1f'; // coat
            ctx.fillRect(player.x+4, player.y+12, 24, 36);
            ctx.fillStyle = '#f4d9a3'; // skin
            ctx.fillRect(player.x+10, player.y, 12, 18);
            ctx.fillStyle = '#2a2a2a'; // hat
            ctx.fillRect(player.x+6, player.y-8, 20, 12);
            ctx.fillStyle = '#8b5a2b'; // boots
            ctx.fillRect(player.x+8, player.y+42, 16, 6);

            // Faith orbs
            ctx.fillStyle = '#ff0';
            ctx.beginPath(); ctx.arc(400,190,15,0,Math.PI*2); ctx.fill();
            ctx.fillStyle = '#ffaa00';
            ctx.beginPath(); ctx.arc(650,130,15,0,Math.PI*2); ctx.fill();

            // Pillar of Light
            ctx.fillStyle = '#ffeecc';
            ctx.fillRect(710,80,35,340);
            ctx.fillStyle = '#ffffaa';
            ctx.fillRect(715,100,25,300);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        setInterval(() => {
            if (player.x > 680 && faith > 65) {
                alert("🎉 First Vision Complete!\n\nJoseph witnessed the Pillar of Light.\nFaith strengthened. Next: Hill Cumorah coming soon!");
                player.x = 80;
                faith = 40;
            }
        }, 200);

        loop();
    </script>
</body>
</html>
